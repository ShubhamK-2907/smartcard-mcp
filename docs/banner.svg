<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SmartCard: always swipe the right card</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#16123a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)" opacity="0.35"/>
  <circle cx="1030" cy="180" r="290" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="72" y="148" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">SmartCard</text>
  <text x="76" y="194" font-size="26" font-weight="600" fill="#c7d2fe">Always swipe the right card.</text>
  <text x="76" y="234" font-size="16.5" fill="#94a3b8">An MCP server that ranks your credit cards for every purchase,</text>
  <text x="76" y="258" font-size="16.5" fill="#94a3b8">tracking rewards, monthly caps and cashback on your own machine.</text>

  <g font-size="13" fill="#e2e8f0">
    <rect x="76" y="284" width="186" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#475569"/>
    <text x="169" y="304" text-anchor="middle">Model Context Protocol</text>
    <rect x="272" y="284" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#475569"/>
    <text x="324" y="304" text-anchor="middle">Python 3.12</text>
    <rect x="386" y="284" width="76" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#475569"/>
    <text x="424" y="304" text-anchor="middle">SQLite</text>
    <rect x="472" y="284" width="140" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#475569"/>
    <text x="542" y="304" text-anchor="middle">Source-available</text>
  </g>

  <!-- card stack -->
  <g transform="translate(860 70) rotate(-12)">
    <rect width="300" height="188" rx="18" fill="url(#c3)" opacity="0.85"/>
    <rect width="300" height="188" rx="18" fill="url(#sheen)"/>
  </g>
  <g transform="translate(900 95) rotate(-4)">
    <rect width="300" height="188" rx="18" fill="url(#c2)" opacity="0.92"/>
    <rect width="300" height="188" rx="18" fill="url(#sheen)"/>
  </g>
  <g transform="translate(950 120) rotate(6)">
    <rect width="300" height="188" rx="18" fill="url(#c1)"/>
    <rect width="300" height="188" rx="18" fill="url(#sheen)"/>
    <rect width="300" height="188" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="26" y="38" font-size="13" font-weight="700" letter-spacing="3" fill="#ffffff" fill-opacity="0.9">SMARTCARD</text>
    <!-- chip -->
    <rect x="26" y="56" width="44" height="34" rx="6" fill="#fbbf24"/>
    <path d="M26 73h44M41 56v34M55 56v34" stroke="#b45309" stroke-width="1.2" fill="none"/>
    <!-- contactless -->
    <path d="M86 64a12 12 0 0 1 0 18M93 59a19 19 0 0 1 0 28M100 54a26 26 0 0 1 0 38" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="26" y="132" font-size="19" letter-spacing="2" fill="#ffffff" fill-opacity="0.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">•••• •••• •••• 2400</text>
    <text x="26" y="166" font-size="11" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.75">BEST PICK · 10% BACK</text>
    <circle cx="246" cy="158" r="14" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="266" cy="158" r="14" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- best pick badge -->
  <g transform="translate(1096 88)">
    <rect width="138" height="36" rx="18" fill="#22c55e"/>
    <circle cx="20" cy="18" r="10" fill="#052e16" fill-opacity="0.2"/>
    <path d="M14.5 18.5l4 4 7.5-8.5" stroke="#052e16" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="24" font-size="15" font-weight="700" fill="#052e16">Best pick</text>
  </g>
  </g>
</svg>

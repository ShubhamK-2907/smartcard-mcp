<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SmartCard high-level design</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#121a3a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a78bfa"/>
    </marker>
    <style>
      .t { fill: #f8fafc; font-weight: 700; }
      .s { fill: #94a3b8; }
      .b { fill: #cbd5e1; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="860" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="860" rx="24" fill="url(#grid)" opacity="0.45"/>

  <!-- title -->
  <text x="40" y="58" class="t" font-size="24">SmartCard · High-Level Design</text>
  <text x="40" y="84" class="s" font-size="14">How an AI assistant uses the SmartCard MCP server to pick the best card for a purchase</text>

  <!-- ============ column 1: user + MCP host ============ -->
  <rect x="40" y="165" width="260" height="90" rx="14" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.7"/>
  <circle cx="80" cy="197" r="10" fill="#c4b5fd"/>
  <path d="M62 232c0-12 8-19 18-19s18 7 18 19z" fill="#c4b5fd"/>
  <text x="112" y="203" class="t" font-size="16">User</text>
  <text x="112" y="225" class="s" font-size="12.5">asks in plain language</text>

  <line x1="170" y1="255" x2="170" y2="327" class="flow" marker-end="url(#ah)"/>
  <rect x="45" y="278" width="250" height="26" rx="13" fill="#0b1120" stroke="#334155"/>
  <text x="170" y="295" text-anchor="middle" font-size="12" font-style="italic" fill="#e2e8f0">“Which card for ₹2,400 on Swiggy?”</text>

  <rect x="40" y="330" width="260" height="250" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.7"/>
  <text x="60" y="360" class="t" font-size="16">MCP host</text>
  <text x="60" y="381" class="s" font-size="12.5">Claude Code · Claude Desktop</text>
  <text x="60" y="398" class="s" font-size="12.5">or any MCP client</text>
  <rect x="58" y="414" width="224" height="100" rx="10" fill="#0b1120" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="74" y="438" class="t" font-size="13.5">LLM (Claude)</text>
  <text x="74" y="460" class="b" font-size="12">• reads tool schemas &amp; hints</text>
  <text x="74" y="478" class="b" font-size="12">• chooses and calls tools</text>
  <text x="74" y="496" class="b" font-size="12">• explains results to the user</text>
  <rect x="58" y="528" width="224" height="34" rx="8" fill="#0b1120" stroke="#334155"/>
  <text x="170" y="549" text-anchor="middle" class="m" font-size="11.5" fill="#c4b5fd">uv run smartcard  (stdio)</text>

  <!-- host <-> server -->
  <line x1="300" y1="350" x2="368" y2="350" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#ahv)"/>
  <line x1="368" y1="374" x2="302" y2="374" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#ahv)"/>
  <text x="334" y="342" text-anchor="middle" font-size="10.5" fill="#c4b5fd">tools/call</text>
  <text x="334" y="390" text-anchor="middle" font-size="10.5" fill="#c4b5fd">results</text>

  <!-- ============ column 2: SmartCard server ============ -->
  <rect x="370" y="110" width="560" height="680" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="395" y="143" class="t" font-size="18">SmartCard MCP server</text>
  <text x="905" y="143" text-anchor="end" class="s" font-size="12">Python 3.12 · MCP SDK 2.x</text>

  <!-- L1 interface -->
  <rect x="395" y="165" width="510" height="215" rx="12" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-opacity="0.6"/>
  <text x="411" y="191"><tspan class="t" font-size="14.5">server.py</tspan><tspan class="s" font-size="12.5" dx="8">MCP interface</tspan></text>
  <rect x="677" y="176" width="212" height="22" rx="11" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="783" y="191" text-anchor="middle" font-size="11.5" fill="#bfdbfe">15 tools · 1 resource · 1 prompt</text>

  <rect x="411" y="205" width="152" height="132" rx="9" fill="#0b1120" stroke="#3b82f6" stroke-opacity="0.35"/>
  <text x="423" y="225" font-size="12" font-weight="700" fill="#bfdbfe">Cards</text>
  <g class="m b" font-size="11">
    <text x="423" y="243">list_cards</text>
    <text x="423" y="257.5">card_details</text>
    <text x="423" y="272">add_card</text>
    <text x="423" y="286.5">update_card</text>
    <text x="423" y="301">remove_card</text>
    <text x="423" y="315.5">add_earn_rate</text>
    <text x="423" y="330">remove_earn_rate</text>
  </g>

  <rect x="574" y="205" width="152" height="132" rx="9" fill="#0b1120" stroke="#3b82f6" stroke-opacity="0.35"/>
  <text x="586" y="225" font-size="12" font-weight="700" fill="#bfdbfe">Purchases</text>
  <g class="m b" font-size="11">
    <text x="586" y="243">recommend_card</text>
    <text x="586" y="257.5">log_purchase</text>
    <text x="586" y="272">list_purchases</text>
    <text x="586" y="286.5">delete_purchase</text>
  </g>
  <text x="586" y="315.5" class="m" font-size="10.5" fill="#93c5fd">prompt:</text>
  <text x="586" y="330" class="m" font-size="10.5" fill="#93c5fd">set_up_card</text>

  <rect x="737" y="205" width="152" height="132" rx="9" fill="#0b1120" stroke="#3b82f6" stroke-opacity="0.35"/>
  <text x="749" y="225" font-size="12" font-weight="700" fill="#bfdbfe">Rewards &amp; insight</text>
  <g class="m b" font-size="11">
    <text x="749" y="243">rewards_balance</text>
    <text x="749" y="257.5">adjust_rewards</text>
    <text x="749" y="272">spending_report</text>
    <text x="749" y="286.5">search_card_terms</text>
  </g>

  <g font-size="11">
    <rect x="411" y="347" width="171" height="22" rx="11" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="496.5" y="362" text-anchor="middle" fill="#dbeafe">Pydantic-validated inputs</text>
    <rect x="590" y="347" width="116" height="22" rx="11" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="648" y="362" text-anchor="middle" fill="#dbeafe">Tool annotations</text>
    <rect x="714" y="347" width="175" height="22" rx="11" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="801.5" y="362" text-anchor="middle" class="m" fill="#dbeafe">smartcard://categories</text>
  </g>

  <line x1="650" y1="380" x2="650" y2="407" class="flow" marker-end="url(#ah)"/>

  <!-- L2 service -->
  <rect x="395" y="410" width="510" height="108" rx="12" fill="#14b8a6" fill-opacity="0.10" stroke="#14b8a6" stroke-opacity="0.6"/>
  <text x="411" y="436"><tspan class="t" font-size="14.5">wallet.py</tspan><tspan class="s" font-size="12.5" dx="8">Wallet service · all business operations</tspan></text>
  <g font-size="11.5" fill="#ccfbf1">
    <rect x="411" y="450" width="101" height="22" rx="11" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="461.5" y="465" text-anchor="middle">Card registry</text>
    <rect x="520" y="450" width="82" height="22" rx="11" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="561" y="465" text-anchor="middle">Earn rates</text>
    <rect x="610" y="450" width="95" height="22" rx="11" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="657.5" y="465" text-anchor="middle">Purchase log</text>
    <rect x="713" y="450" width="140" height="22" rx="11" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="783" y="465" text-anchor="middle">Cap usage per cycle</text>
    <rect x="411" y="480" width="95" height="22" rx="11" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="458.5" y="495" text-anchor="middle">Card ranking</text>
    <rect x="514" y="480" width="159" height="22" rx="11" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="593.5" y="495" text-anchor="middle">Balances &amp; redemptions</text>
    <rect x="681" y="480" width="120" height="22" rx="11" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="741" y="495" text-anchor="middle">Spending reports</text>
  </g>

  <line x1="520" y1="518" x2="520" y2="547" class="flow" marker-end="url(#ah)"/>
  <line x1="780" y1="518" x2="780" y2="547" class="flow" marker-end="url(#ah)"/>
  <line x1="650" y1="518" x2="650" y2="702" class="flow" marker-end="url(#ah)"/>

  <!-- L3 engines -->
  <rect x="395" y="550" width="250" height="125" rx="12" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="411" y="576" class="t" font-size="14.5">rewards.py</text>
  <text x="411" y="594" class="s" font-size="12">rewards engine · pure functions</text>
  <g class="b" font-size="12">
    <text x="411" y="614">• Spend blocks per ₹ spent</text>
    <text x="411" y="631">• Merchant › category matching</text>
    <text x="411" y="648">• Monthly caps → base-rate spill</text>
    <text x="411" y="665">• Statement-cycle windows</text>
  </g>

  <rect x="655" y="550" width="250" height="125" rx="12" fill="#ec4899" fill-opacity="0.10" stroke="#ec4899" stroke-opacity="0.6"/>
  <text x="671" y="576" class="t" font-size="14.5">categories.py</text>
  <text x="671" y="594" class="s" font-size="12">category intelligence</text>
  <g class="b" font-size="12">
    <text x="671" y="614">• 15 spending categories</text>
    <text x="671" y="631">• Synonyms (food → dining)</text>
    <text x="671" y="648">• Merchant hints (Swiggy …)</text>
    <text x="671" y="665">• Default exclusions (fuel …)</text>
  </g>

  <!-- L4 storage -->
  <rect x="395" y="705" width="510" height="62" rx="12" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.6"/>
  <text x="411" y="731"><tspan class="t" font-size="14.5">db.py</tspan><tspan class="s" font-size="12.5" dx="8">SQLite storage</tspan></text>
  <text x="411" y="751" class="s" font-size="12">schema · connection · row ↔ dataclass mapping</text>

  <!-- ============ column 3: external ============ -->
  <line x1="905" y1="258" x2="987" y2="258" class="flow" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="947" y="250" text-anchor="middle" class="s" font-size="10.5">HTTPS</text>

  <rect x="990" y="195" width="250" height="125" rx="14" fill="#64748b" fill-opacity="0.12" stroke="#64748b" stroke-opacity="0.8"/>
  <circle cx="1212" cy="222" r="11" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
  <ellipse cx="1212" cy="222" rx="5" ry="11" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="1201" y1="222" x2="1223" y2="222" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1008" y="223" class="t" font-size="15">Web search</text>
  <text x="1008" y="242" class="s" font-size="12">DuckDuckGo via ddgs</text>
  <text x="1008" y="266" class="b" font-size="12">search_card_terms looks up</text>
  <text x="1008" y="283" class="b" font-size="12">published reward terms</text>
  <rect x="1008" y="294" width="148" height="20" rx="10" fill="#64748b" fill-opacity="0.3"/>
  <text x="1082" y="308" text-anchor="middle" font-size="10.5" fill="#e2e8f0">open-world · read-only</text>

  <rect x="990" y="385" width="250" height="180" rx="14" fill="none" stroke="#475569" stroke-dasharray="4 4"/>
  <text x="1008" y="413" class="t" font-size="14">Design principles</text>
  <g class="b" font-size="12">
    <text x="1008" y="440">• Thin MCP layer, testable core</text>
    <text x="1008" y="463">• Pure reward maths (no I/O)</text>
    <text x="1008" y="486">• Local data, no card numbers</text>
    <text x="1008" y="509">• Deletes need confirmation</text>
    <text x="1008" y="532">• 37 automated tests</text>
  </g>

  <line x1="905" y1="736" x2="987" y2="736" class="flow" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="947" y="728" text-anchor="middle" class="s" font-size="10.5">SQL</text>

  <path d="M990 650v140a125 16 0 0 0 250 0v-140" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.7"/>
  <ellipse cx="1115" cy="650" rx="125" ry="16" fill="#22c55e" fill-opacity="0.22" stroke="#22c55e" stroke-opacity="0.7"/>
  <text x="1010" y="692" class="t" font-size="15">SQLite</text>
  <text x="1010" y="712" class="m" font-size="11.5" fill="#86efac">~/.smartcard/smartcard.db</text>
  <g class="m" font-size="11" fill="#dcfce7">
    <rect x="1010" y="724" width="49" height="20" rx="10" fill="#22c55e" fill-opacity="0.18"/>
    <text x="1034.5" y="738" text-anchor="middle">cards</text>
    <rect x="1065" y="724" width="82" height="20" rx="10" fill="#22c55e" fill-opacity="0.18"/>
    <text x="1106" y="738" text-anchor="middle">earn_rates</text>
    <rect x="1010" y="750" width="75" height="20" rx="10" fill="#22c55e" fill-opacity="0.18"/>
    <text x="1047.5" y="764" text-anchor="middle">purchases</text>
    <rect x="1091" y="750" width="89" height="20" rx="10" fill="#22c55e" fill-opacity="0.18"/>
    <text x="1135.5" y="764" text-anchor="middle">adjustments</text>
  </g>

  <!-- footer legend -->
  <line x1="40" y1="826" x2="76" y2="826" class="flow" marker-end="url(#ah)"/>
  <text x="86" y="830" class="s" font-size="12">stdio / in-process call</text>
  <line x1="250" y1="826" x2="286" y2="826" class="flow" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="296" y="830" class="s" font-size="12">network call</text>
  <text x="1240" y="830" text-anchor="end" class="s" font-size="12">Protocol: Model Context Protocol (JSON-RPC 2.0) over stdio</text>
</svg>

[project]
name = "smartcard"
version = "0.1.0"
description = "SmartCard: an MCP server that tells you which credit card to swipe"
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Shubham Kumar Sahoo" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "claude", "credit-card", "credit-card-rewards", "cashback", "fintech", "india"]

requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "ddgs>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/ShubhamK-2907/smartcard-mcp"
Repository = "https://github.com/ShubhamK-2907/smartcard-mcp"

[project.scripts]
smartcard = "smartcard.server:main"
smartcard-demo = "smartcard.demo:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

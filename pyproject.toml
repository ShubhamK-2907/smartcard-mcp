[project]
name = "smartcard"
version = "0.1.0"
description = "SmartCard: an MCP server that tells you which credit card to swipe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubham Kumar Sahoo" }]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "ddgs>=9.0.0",
]

[project.scripts]
smartcard = "smartcard.server:main"
smartcard-demo = "smartcard.demo:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
